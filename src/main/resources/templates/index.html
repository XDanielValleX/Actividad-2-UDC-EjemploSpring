<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EJEMPLO DE APP WEB MVC CON SPRING BOOT</title>
</head>
<body>
    <header th:replace="plantillas/partes :: cabecera"></header>
    <h2 th:text="#{usuario.formulario}">PAGINA DE INICIO</h2>
    <p th:text="${mensaje}">Mensaje por defecto</p>
    <p th:text="${dato}">Dato por defecto</p>
    <p><a th:href="@{/agregar}" th:text="#{usuario.crear}">AGREGAR USUARIO</a></p>
    <h4 th:text="#{usuario.lista-vacia}">LISTA DE PERSONAS</h4>
    <div th:if="${usuarios} != null and !${usuarios}.empty">
        <table border="1">
            <tr>
                <th th:text="#{usuario.cedula}">CEDULA</th>
                <th th:text="#{usuario.clave}">CLAVE</th>
                <th th:text="#{usuario.nombre}">NOMBRE</th>
                <th th:text="#{usuario.email}">EMAIL</th>
                <th th:text="#{accion.editar}">EDITAR</th>
                <th th:text="#{accion.eliminar}">ELIMINAR</th>
            </tr>
            <tr th:each="u : ${usuarios}">
                <td th:text="${u.cedula}"></td>
                <td th:text="${u.clave}"></td>
                <td th:text="${u.nombre}"></td>
                <td th:text="${u.email}"></td>
                <td><a th:href="@{/editar/{cedula}(cedula=${u.cedula})}">EDITAR</a></td>
                <td><a th:href="@{/eliminar/{cedula}(cedula=${u.cedula})}">ELIMINAR</a></td>
            </tr>
        </table>
    </div>
    <div th:if="${usuarios} == null or ${usuarios}.empty" th:text="#{usuario.lista-vacia}">La lista de Usuarios esta Vacia</div>
    <hr>
    <b th:text="#{usuario.cedula}">CEDULA:</b><span th:text="${alguien.cedula}"></span><br>
    <b th:text="#{usuario.clave}">CLAVE:</b><span th:text="${alguien.clave}"></span><br>
    <b th:text="#{usuario.nombre}">NOMBRE:</b><span th:text="${alguien.nombre}"></span><br>
    <b th:text="#{usuario.email}">EMAIL:</b><span th:text="${alguien.email}"></span><br>
    <footer th:replace="plantillas/partes :: pie"></footer>
</body>
</html>
